<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>OpenDMD</title>
<link rel="preload" href="./fonts/silkscreen.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./app.css">
</head>
<body>
<header id="top">
  <strong>OpenDMD</strong>
  <span id="where" class="muted">Connecting…</span>
</header>
<nav id="nav">
  <a href="#now" data-view="now"><i>▶&#xFE0E;</i><span>Now</span></a>
  <a href="#library" data-view="library"><i>▦</i><span>Library</span></a>
  <a href="#sets" data-view="sets"><i>☰</i><span>Playlists</span></a>
  <a href="#formulas" data-view="formulas"><i>Ψ</i><span>Formulas</span></a>
  <a href="#create" data-view="create" id="nav-art"><i>✎&#xFE0E;</i><span>Create<b class="na"> Art</b></span></a>
  <a href="#settings" data-view="settings"><i>⚙&#xFE0E;</i><span>Settings</span></a>
</nav>
<main id="main">
  <section id="view-now" class="view"></section>
  <section id="view-library" class="view"></section>
  <section id="view-sets" class="view"></section>
  <section id="view-formulas" class="view"></section>
  <section id="view-create" class="view"></section>
  <section id="view-settings" class="view"></section>
</main>
<div id="toasts" aria-live="polite"></div>
<template id="t-local">
  <div class="card">
    <h2>No device here</h2>
    <p class="muted">This page is not being served by an OpenDMD player, so it runs
      in <b>local mode</b>: pick an extracted copy of a card (the folder holding
      <code>gifs/</code> and <code>filelist.txt</code>) or a few GIFs. Nothing is
      uploaded; files are read one at a time as they play.</p>
    <div class="row">
      <label class="btn">Card folder… <input type="file" id="pick-dir" webkitdirectory directory hidden></label>
      <label class="btn">GIF files… <input type="file" id="pick-files" multiple accept=".gif,image/gif" hidden></label>
    </div>
  </div>
</template>
<script type="module" src="./app.js"></script>
</body>
</html>
